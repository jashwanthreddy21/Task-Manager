version: '3.8'

services:
  # Database Service
  db:
    image: postgres:15-alpine
    container_name: saas_postgres_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: taskmanager
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"

  # Backend FastAPI REST API & WebSockets
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: saas_fastapi_backend
    restart: always
    environment:
      - PROJECT_NAME=SaaS Task Manager
      - SECRET_KEY=super-secret-jwt-key-replace-in-production-a928c0b2d398f
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=60
      - REFRESH_TOKEN_EXPIRE_DAYS=7
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/taskmanager
      - UPLOAD_DIR=/workspace/uploads
      - ALLOWED_ORIGINS=http://localhost:5173,http://localhost:3000,http://localhost:80,http://localhost
    volumes:
      - uploads_data:/workspace/uploads
    expose:
      - "8000"
    depends_on:
      - db

  # Frontend Vite React Single Page App
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: saas_vite_frontend
    restart: always
    expose:
      - "8"
    depends_on:
      - backend

  # Nginx Gateway Routing Proxy
  nginx:
    image: nginx:alpine
    container_name: saas_nginx_gateway
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
    driver: local
  uploads_data:
    driver: local
